name: Sincronizar viviendas Odoo -> EasyBroker

# Se ejecuta cada 10 minutos y también se puede lanzar a mano desde la pestaña
# "Actions" de GitHub (botón "Run workflow") para probar sin esperar al cron.
#VIC on:
#VIC  schedule:
#VIC    - cron: "*/10 * * * *"
#VIC  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r integrations/odoo-easybroker-sync/scripts/requirements.txt

      - name: Ejecutar la sincronización
        env:
          ODOO_URL: ${{ vars.ODOO_URL }}
          ODOO_DB: ${{ vars.ODOO_DB }}
          ODOO_USERNAME: ${{ vars.ODOO_USERNAME }}
          ODOO_API_KEY: ${{ secrets.API_ODOO_TROVA }}
          EASYBROKER_API_KEY: ${{ secrets.API_EASY_BROKER }}
        run: python integrations/odoo-easybroker-sync/scripts/sync_to_easybroker.py
