name: Sincronizar viviendas Odoo -> EasyBroker

# Se ejecuta cada 6 horas y también se puede lanzar a mano desde la pestaña
# "Actions" de GitHub (botón "Run workflow") para probar sin esperar al cron.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      backfill_metadata:
        description: "Fijar Venta/Disponible y completar ubicación desde EasyBroker"
        required: false
        default: false
        type: boolean
  # Disparador temporal y acotado para ejecutar el backfill confirmado.
  # Se retirará junto con el archivo marcador al terminar.
  push:
    paths:
      - ".github/backfill-property-metadata"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r integrations/odoo-easybroker-sync/scripts/requirements.txt

      - name: Completar metadatos en Odoo
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.backfill_metadata) || github.event_name == 'push' }}
        env:
          ODOO_URL: ${{ vars.ODOO_URL }}
          ODOO_DB: ${{ vars.ODOO_DB }}
          ODOO_USERNAME: ${{ vars.ODOO_USERNAME }}
          ODOO_API_KEY: ${{ secrets.API_ODOO_TROVA }}
          EASYBROKER_API_KEY: ${{ secrets.API_EASY_BROKER }}
        run: python integrations/odoo-easybroker-sync/scripts/backfill_property_sync_fields.py

      - name: Ejecutar la sincronización
        env:
          ODOO_URL: ${{ vars.ODOO_URL }}
          ODOO_DB: ${{ vars.ODOO_DB }}
          ODOO_USERNAME: ${{ vars.ODOO_USERNAME }}
          ODOO_API_KEY: ${{ secrets.API_ODOO_TROVA }}
          EASYBROKER_API_KEY: ${{ secrets.API_EASY_BROKER }}
          SYNC_ALERT_EMAILS: ${{ secrets.SYNC_ALERT_EMAILS }}
        run: python integrations/odoo-easybroker-sync/scripts/sync_to_easybroker.py
